# TRPG Game - Go Backend Configuration
# 开发环境配置

server:
  port: "8080"
  mode: debug

database:
  host: localhost
  port: "3306"
  user: root
  password: 123456
  dbname: trpggame
  charset: utf8mb4
  loc: Local

redis:
  addr: localhost:6379
  password: ""
  db: 0

jwt:
  secret: "dev-secret-change-in-production-please"
  accesstokenttl: 15
  refreshtokenttl: 168

ai:
  baseurl: http://localhost:8000
  timeout: 60

minio:
  endpoint: localhost:9000
  accesskey: admin
  secretkey: adminadmin
  bucket: trpg-scripts
  usessl: false
  maxuploadsize: 52428800 # 50 MiB，单位：字节

websocket:
  allowedorigins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1"

internal:
  shared_secret: "dev-internal-secret-change-in-production"

# Recovery remains active for already enabled rooms; this does not enable new rooms.
game_memory:
  new_rooms_enabled: false

game_archive:
  poll_interval_ms: 1000
  batch_size: 32
  operation_timeout_ms: 5000
  lease_ms: 30000
  retry_base_ms: 1000
  retry_max_ms: 30000
  shutdown_timeout_ms: 7000
