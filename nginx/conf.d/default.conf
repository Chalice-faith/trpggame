# TRPG Game — Nginx 反向代理配置
# 开发环境：HTTP only，无 HTTPS

upstream go_backend {
    server go-backend:8080;
}

upstream python_ai {
    server python-ai:8000;
}

server {
    listen 80;
    server_name localhost;

    # 文件上传大小限制
    client_max_body_size 100m;

    # ============================================================
    # Vue SPA 静态资源（生产部署用）
    # ============================================================
    location / {
        # 开发阶段代理到 Vite dev server
        # 生产阶段改为：root /usr/share/nginx/html;
        proxy_pass http://vue-frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============================================================
    # Go Backend API
    # ============================================================
    location /api/ {
        proxy_pass http://go_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============================================================
    # WebSocket
    # ============================================================
    location /ws {
        proxy_pass http://go_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ============================================================
    # Python AI Service (internal, 不直接暴露给前端)
    # ============================================================
    location /ai/ {
        # 仅内部调用，实际不通过 Nginx 暴露
        deny all;
    }
}
